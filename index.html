<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hipertrofia Coach PRO</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.card{background:#111827;padding:15px;border-radius:10px;margin-bottom:10px}
input,select{padding:8px;margin:5px;border-radius:5px;border:none}
button{padding:10px;margin:5px;border:none;border-radius:5px;cursor:pointer}
.green{background:#22c55e;color:white}
.blue{background:#3b82f6;color:white}
.yellow{background:#facc15;color:black}
</style>
</head>
<body>

<h1>Hipertrofia Coach PRO</h1>

<label>Semana:</label>
<select id="week">
</select>

<label>Día:</label>
<select id="day">
  <option>Lunes</option>
  <option>Martes</option>
  <option>Miércoles</option>
  <option>Jueves</option>
  <option>Viernes</option>
</select>

<div id="info"></div>
<div id="exercises"></div>

<script>
const weekSelect = document.getElementById("week");
for(let i=1;i<=8;i++){
  weekSelect.innerHTML += `<option value="${i}">Semana ${i}</option>`;
}

const plan = {
  "Lunes":["Press banca","Press inclinado"],
  "Martes":["Sentadilla","Prensa"],
  "Miércoles":["Dominadas","Remo"],
  "Jueves":["Press máquina","Jalón"],
  "Viernes":["RDL","Hip thrust"]
};

function getTargets(week){
  if(week<=2) return {rir:3, reps:"8-10"};
  if(week<=5) return {rir:"1-2", reps:"6-8"};
  if(week<=7) return {rir:1, reps:"5-6"};
  return {rir:"3-4", reps:"8"};
}

function render(){
  const week = parseInt(weekSelect.value);
  const day = document.getElementById("day").value;
  const target = getTargets(week);

  document.getElementById("info").innerHTML = `
    <div class="card">
      <strong>Semana ${week}</strong><br>
      Objetivo Reps: ${target.reps}<br>
      Objetivo RIR: ${target.rir}
    </div>
  `;

  let html="";
  plan[day].forEach(ex=>{
    html += `
    <div class="card">
      <strong>${ex}</strong><br>
      Peso: <input><br>
      Reps: <input><br>
      RIR: <input><br>
      <button class="blue">Iniciar descanso</button>
    </div>`;
  });

  document.getElementById("exercises").innerHTML = html;
}

weekSelect.value = 1;
render();

document.getElementById("day").onchange = render;
weekSelect.onchange = render;

</script>

</body>
</html>
