<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hipertrofia - Registro de Entrenamiento</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card2: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent2: #16a34a;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      padding: 16px;
    }

    .app {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
    }

    .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .exercise-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .save {
      background: var(--accent);
      width: 100%;
      margin: 10px 0 18px;
    }

    .save:hover { background: var(--accent2); }

    .secondary {
      background: var(--card2);
    }

    .danger {
      background: var(--danger);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .history-title {
      margin-top: 22px;
      font-size: 22px;
    }

    .history-item {
      background: rgba(31, 41, 55, .85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .history-head {
      font-weight: bold;
      margin-bottom: 8px;
      color: #bbf7d0;
    }

    .history-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(148, 163, 184, .15);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px;
    }

    @media (max-width: 650px) {
      .topbar, .fields, .actions, .history-row {
        grid-template-columns: 1fr;
      }

      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🏋️ Hipertrofia</h1>
    <p class="subtitle">Registro simple de peso y repeticiones</p>

    <div class="topbar">
      <select id="daySelect"></select>
      <input id="dateInput" type="date" />
    </div>

    <div id="exerciseContainer"></div>

    <button class="save" onclick="saveWorkout()">Guardar entrenamiento</button>

    <div class="actions">
      <button class="secondary" onclick="exportCSV()">Exportar CSV</button>
      <button class="danger" onclick="clearHistory()">Borrar historial</button>
    </div>

    <h2 class="history-title">Historial</h2>
    <div id="historyContainer"></div>
  </div>

  <script>
    const routine = {
      "Lunes - Push": [
        "Press banca",
        "Press inclinado",
        "Elevaciones laterales",
        "Fondos",
        "Extensión tríceps polea"
      ],
      "Martes - Cuádriceps + Abdomen": [
        "Sentadilla",
        "Prensa",
        "Zancadas",
        "Extensión cuádriceps",
        "Gemelos",
        "Cable crunch",
        "Dead bug"
      ],
      "Miércoles - Pull": [
        "Dominadas/Jalón",
        "Remo",
        "Face pull",
        "Curl inclinado"
      ],
      "Jueves - Torso + Abdomen": [
        "Press máquina",
        "Jalón",
        "Remo polea",
        "Elevaciones laterales",
        "Curl + tríceps",
        "Elevaciones piernas",
        "Crunch máquina",
        "Plancha"
      ],
      "Viernes - Femoral/Glúteo": [
        "RDL",
        "Hip thrust",
        "Curl femoral",
        "Búlgara"
      ]
    };

    const daySelect = document.getElementById("daySelect");
    const dateInput = document.getElementById("dateInput");
    const exerciseContainer = document.getElementById("exerciseContainer");
    const historyContainer = document.getElementById("historyContainer");

    function todayISO() {
      return new Date().toISOString().split("T")[0];
    }

    function loadDays() {
      Object.keys(routine).forEach(day => {
        const option = document.createElement("option");
        option.value = day;
        option.textContent = day;
        daySelect.appendChild(option);
      });
    }

    function renderExercises() {
      const selectedDay = daySelect.value;
      exerciseContainer.innerHTML = "";

      routine[selectedDay].forEach(exercise => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="exercise-title">${exercise}</div>
          <div class="fields">
            <input type="number" step="0.5" placeholder="Peso usado (kg)" data-exercise="${exercise}" data-field="peso">
            <input type="text" placeholder="Reps realizadas, ej: 10,9,8" data-exercise="${exercise}" data-field="reps">
          </div>
        `;
        exerciseContainer.appendChild(card);
      });
    }

    function getHistory() {
      return JSON.parse(localStorage.getItem("historialHipertrofia") || "[]");
    }

    function setHistory(history) {
      localStorage.setItem("historialHipertrofia", JSON.stringify(history));
    }

    function saveWorkout() {
      const selectedDay = daySelect.value;
      const date = dateInput.value || todayISO();
      const inputs = exerciseContainer.querySelectorAll("input");

      const workout = {
        fecha: date,
        dia: selectedDay,
        ejercicios: []
      };

      routine[selectedDay].forEach(exercise => {
        const peso = [...inputs].find(i => i.dataset.exercise === exercise && i.dataset.field === "peso")?.value || "";
        const reps = [...inputs].find(i => i.dataset.exercise === exercise && i.dataset.field === "reps")?.value || "";

        workout.ejercicios.push({
          ejercicio: exercise,
          peso,
          reps
        });
      });

      const history = getHistory();
      history.unshift(workout);
      setHistory(history);

      renderHistory();
      renderExercises();
      alert("Entrenamiento guardado correctamente.");
    }

    function renderHistory() {
      const history = getHistory();
      historyContainer.innerHTML = "";

      if (history.length === 0) {
        historyContainer.innerHTML = `<div class="empty">Aún no tienes entrenamientos guardados.</div>`;
        return;
      }

      history.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";

        let rows = item.ejercicios.map(e => `
          <div class="history-row">
            <span>${e.ejercicio}</span>
            <span>Peso: ${e.peso || "—"} kg</span>
            <span>Reps: ${e.reps || "—"}</span>
          </div>
        `).join("");

        div.innerHTML = `
          <div class="history-head">${item.fecha} · ${item.dia}</div>
          ${rows}
        `;

        historyContainer.appendChild(div);
      });
    }

    function clearHistory() {
      if (confirm("¿Seguro que quieres borrar todo el historial?")) {
        localStorage.removeItem("historialHipertrofia");
        renderHistory();
      }
    }

    function exportCSV() {
      const history = getHistory();

      if (history.length === 0) {
        alert("No hay datos para exportar.");
        return;
      }

      let csv = "Fecha,Dia,Ejercicio,Peso,Repeticiones\\n";

      history.forEach(item => {
        item.ejercicios.forEach(e => {
          csv += `"${item.fecha}","${item.dia}","${e.ejercicio}","${e.peso}","${e.reps}"\\n`;
        });
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "historial_hipertrofia.csv";
      link.click();

      URL.revokeObjectURL(url);
    }

    loadDays();
    dateInput.value = todayISO();
    renderExercises();
    renderHistory();

    daySelect.addEventListener("change", renderExercises);
  </script>
</body>
</html>
